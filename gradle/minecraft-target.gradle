// This tree targets Forge 1.20.1 with MTR 3 only.
//
// The upstream compat branch also built an MC 1.20.4 target against MTR 4.0.5.
// MTR 3 has no 1.20.4 release and MTR 4 uses a completely different data model
// (org.mtr.core instead of mtr.data), so the 1.20.4 target is intentionally not
// offered here; passing -Pminecraft_version=1.20.4 fails fast.
ext.targetMinecraftVersion = project.findProperty('minecraft_version') ?: '1.20.1'
if (targetMinecraftVersion != '1.20.1') {
    throw new GradleException("This MTR 3 port supports Minecraft 1.20.1 only; got ${targetMinecraftVersion}")
}
ext.legacyJourneyMap = false
ext.targetForgeVersion = gradle.startParameter.projectProperties['forge_version'] ?: '47.4.0'
ext.targetForgeMajor = '47'
ext.targetPackFormat = 15
ext.journeyMapModVersion = "1.20.1-6.0.6+${journeyMapLoader}"
ext.journeyMapMinimum = '1.20.1-6.0.6'

// Only the API surface differs for these data builders. Generate the v1
// variants from the shared implementation so marker/filter fixes stay shared.
// The generated variants are only used by the dropped 1.20.4 target; the task
// is kept so the build script still matches the upstream one.
def sharedRoot = journeyMapLoader == 'forge' ? projectDir : file('..')
def generated = layout.buildDirectory.dir('generated/sources/journeymap5')
def packagePath = 'com/lx862/mtrmap/integration/journeymap'
def adapterNames = ['JourneyMapLandmarkManager.java', 'JourneyMapIntegration.java']
tasks.register('generateJourneyMap5Adapters') {
    onlyIf { legacyJourneyMap }
    inputs.files(adapterNames.collect { new File(sharedRoot, "src/main/java/${packagePath}/${it}") })
    outputs.dir(generated)
    doLast {
        adapterNames.each { name ->
            def source = new File(sharedRoot, "src/main/java/${packagePath}/${name}").getText('UTF-8')
                    .replace('journeymap.api.v2.common.Context', 'journeymap.client.api.display.Context')
                    .replace('journeymap.api.v2.client.', 'journeymap.client.api.')
                    .replace('new MarkerOverlay(MTRMap.MOD_ID,', 'new MarkerOverlay(MTRMap.MOD_ID, java.util.UUID.randomUUID().toString(),')
                    .replace('setActiveUIs(Context.UI.Fullscreen)', 'setActiveUIs(java.util.EnumSet.of(Context.UI.Fullscreen))')
                    .replace('// v2 API generates the marker id internally; markerId is kept for logging only', '// Each sync replaces the previous marker set; v1 requires explicit unique IDs.')
                    .replace('// MC 1.20.1 also has JourneyMap 5 releases without the v2 API.', '// Only invoke the legacy integration when its API is present.')
            def output = new File(generated.get().asFile, "${packagePath}/${name}")
            output.parentFile.mkdirs()
            output.setText(source, 'UTF-8')
        }
    }
}
ext.journeyMap5GeneratedSources = generated
ext.journeyMap5Overrides = adapterNames.collect { "${packagePath}/${it}" }
