// JourneyMap 6 on MC 1.20.1 publishes its v2 API inside the mod JAR.
// Extract that exact API as a compile-only local Maven artifact so ForgeGradle
// and Loom can remap it. Never package JourneyMap or its API in our output.
// Forge JourneyMap 5 exposes its API directly in the mod JAR.
if (legacyJourneyMap && journeyMapLoader == 'forge') return

def apiVersion = legacyJourneyMap ? '1.20.4-5.10.0-fabric' : "1.20.1-6.0.6-${journeyMapLoader}"
def repoRoot = layout.projectDirectory.dir('.gradle/bundled-api').asFile
def artifactDir = new File(repoRoot, "bundled/journeymap/api/${apiVersion}")
def apiJar = new File(artifactDir, "api-${apiVersion}.jar")
repositories { maven { url = repoRoot.toURI() } }
dependencies {
    if (journeyMapLoader == 'forge') {
        if (project.hasProperty('mtrmapRuntimeTest') && !project.hasProperty('mtrmapServerOnly')) {
            runtimeOnly fg.deobf("bundled.journeymap:api:${apiVersion}")
        }
        compileOnly fg.deobf("bundled.journeymap:api:${apiVersion}")
    } else add(project.hasProperty('mtrmapRuntimeTest') && !project.hasProperty('mtrmapServerOnly') ? 'modImplementation' : 'modCompileOnly', "bundled.journeymap:api:${apiVersion}")
}

def checkedJourneyMapBundle = {
    artifactDir.mkdirs()
    // Do not resolve a Gradle configuration here: Loom finalizes its remapped
    // repository later and cannot mutate it after an early resolution.
    def sha1 = legacyJourneyMap ? '76ef4806c00614f79397b7fb1359d83996ca2469' : journeyMapLoader == 'forge' ? 'a3d9009272c0e22d6057a7e5fbed1bfa17a4dea7' : 'ca50b1088522eaab0090df1dd1082d95dfd849b5'
    def versionId = legacyJourneyMap ? 'bV9yidYJ' : journeyMapLoader == 'forge' ? 'gryqmTt2' : '9Msq5MJs'
    def bundle = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/maven.modrinth/journeymap/${journeyMapModVersion}/${sha1}/journeymap-${journeyMapModVersion}.jar")
    if (!bundle.exists()) {
        bundle = new File(artifactDir, 'journeymap-bundle.jar')
        def bundleFileName = legacyJourneyMap ? 'journeymap-1.20.4-5.10.0-fabric.jar' : "journeymap-${journeyMapLoader}-1.20.1-6.0.6.jar"
        def connection = new URI("https://cdn.modrinth.com/data/lfHFW1mp/versions/${versionId}/${bundleFileName}").toURL().openConnection()
        connection.connectTimeout = 30000
        connection.readTimeout = 60000
        connection.getInputStream().withCloseable { input -> bundle.withOutputStream { it << input } }
    }
    def digest = java.security.MessageDigest.getInstance('SHA-1')
    bundle.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int length
        while ((length = input.read(buffer)) != -1) digest.update(buffer, 0, length)
    }
    if (digest.digest().encodeHex().toString() != sha1) throw new GradleException('JourneyMap bundle checksum mismatch')
    return bundle
}

if (!apiJar.exists()) {
    def bundle = checkedJourneyMapBundle()
    new java.util.zip.ZipFile(bundle).withCloseable { zip ->
        def entry = zip.entries().find { it.name.contains('/journeymap-api-') && it.name.endsWith('.jar') }
        if (entry == null) throw new GradleException('JourneyMap bundle contains no API JAR')
        zip.getInputStream(entry).withCloseable { input -> apiJar.withOutputStream { it << input } }
    }
    new File(artifactDir, "api-${apiVersion}.pom").text = """<project><modelVersion>4.0.0</modelVersion><groupId>bundled.journeymap</groupId><artifactId>api</artifactId><version>${apiVersion}</version></project>"""
}

// Fabric's development launcher needs JourneyMap 6's nested runtime libraries
// as explicit dependencies. They remain absent from ordinary release builds.
if (journeyMapLoader == 'fabric' && !legacyJourneyMap && project.hasProperty('mtrmapRuntimeTest') && !project.hasProperty('mtrmapServerOnly')) {
    ['commonnetwork': 'common-networking-fabric-', 'pngj': 'pngj-'].each { artifact, prefix ->
        def moduleDir = new File(repoRoot, "bundled/journeymap/${artifact}/${apiVersion}")
        def moduleJar = new File(moduleDir, "${artifact}-${apiVersion}.jar")
        if (!moduleJar.exists()) {
            moduleDir.mkdirs()
            new java.util.zip.ZipFile(checkedJourneyMapBundle()).withCloseable { zip ->
                def entry = zip.entries().find { it.name.startsWith("META-INF/jars/${prefix}") && it.name.endsWith('.jar') }
                if (entry == null) throw new GradleException("JourneyMap bundle contains no ${artifact} JAR")
                zip.getInputStream(entry).withCloseable { input -> moduleJar.withOutputStream { it << input } }
            }
        }
        new File(moduleDir, "${artifact}-${apiVersion}.pom").text = "<project><modelVersion>4.0.0</modelVersion><groupId>bundled.journeymap</groupId><artifactId>${artifact}</artifactId><version>${apiVersion}</version></project>"
        dependencies.add(artifact == 'commonnetwork' ? 'modImplementation' : 'runtimeOnly', "bundled.journeymap:${artifact}:${apiVersion}")
    }
}
