org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
# ForgeGradle aborts on a flaky TLS handshake with maven.minecraftforge.net;
# the upstream MTRSurveyor-era build script carried the same workaround.
systemProp.net.minecraftforge.gradle.check.certs=false
minecraft_version=1.20.1
forge_version=47.4.0
mod_version=1.5.1
maven_group=com.lx862
archives_base_name=CRTools-MTR-Map-Overlay
# MTR 3 port target: MTR 3.2.2-hotfix-2 is the latest MTR 3 release for Forge 1.20.1.
# mtr_version is the version MTR reports in its own mods.toml (used for the dependency
# range in META-INF/mods.toml); mtr_modrinth_version is the Modrinth file slug.
mtr_version=1.20.1-3.2.2-hotfix-2
mtr_modrinth_version=1.20.1-3.2.2-hotfix-2
