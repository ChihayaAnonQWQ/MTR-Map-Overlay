modLoader = "javafml"
loaderVersion = "[${forge_major},)"
license = "MIT"
issueTrackerURL = "https://github.com/teamCreating/MTR-Map-Overlay/issues"

[[mods]]
modId = "mtrmap"
version = "${version}"
displayName = "MTR Map Overlay"
description = '''Displays MTR route ribbons, track geometry and map-only station/platform icons on Xaero's World Map and JourneyMap. Supports optional full-network sync when installed on the server.'''
logoFile = "assets/mtrmap/icon.png"
authors = "BenLi06"
credits = "MTR 4 -> MTR 3 port by DeepSeek (DeepSeek Harness); original mod by AmberFrost and BenLi06/teamCreating"

[[dependencies.mtrmap]]
modId = "forge"
mandatory = true
versionRange = "[${forge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtrmap]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtrmap]]
modId = "mtr"
mandatory = true
# MTR 3 only. MTR 4 (4.0+) moved its data model to org.mtr.core and is not
# compatible. MTR 3 reports its mod version with the Minecraft prefix, e.g.
# "1.20.1-3.2.2-hotfix-2", so the range is written in that form.
versionRange = "[${mtr_version},1.20.1-4.0.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mtrmap]]
modId = "xaerominimap"
mandatory = false
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.mtrmap]]
modId = "xaeroworldmap"
mandatory = false
# Optional integration. The GuiMap fields and the MapProcessor -> MapWorld ->
# MapDimension chain used by the mixins/accessors are identical in 1.40.11,
# 1.44.2 and 1.45.0, and the mixins are require = 0 plus guarded by
# XaeroMixinPlugin, so the range only needs to exclude versions without that
# API (the MTR 4 branch pinned [1.45.0,), which refused to load for anyone on
# 1.44.x even though the code works there).
versionRange = "[1.40.0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.mtrmap]]
modId = "journeymap"
mandatory = false
# Optional integration: the v2 API is probed at runtime
# (JourneyMapIntegration#isJourneyMapLoaded), so JourneyMap 5 is tolerated by
# disabling the integration instead of failing the whole mod load.
versionRange = "[1.20.1-6.0.0,)"
ordering = "AFTER"
side = "CLIENT"

