# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: forge-mc1.20.1
            wrapper: ./gradlew
            build-args: build
            artifact-path: build/libs/*.jar
          - loader: fabric-mc1.20.1
            wrapper: ./fabric/gradlew
            build-args: -p fabric build
            artifact-path: fabric/build/libs/*.jar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: ${{ matrix.loader == 'fabric-mc1.20.1' }}
      - name: Make Gradle wrapper executable
        run: chmod +x ${{ matrix.wrapper }}
      - name: Build ${{ matrix.loader }}
        run: ${{ matrix.wrapper }} ${{ matrix.build-args }}
      - name: Verify packaged JAR and tests
        run: python3 tools/verify_artifacts.py --loader "${{ startsWith(matrix.loader, 'forge') && 'forge' || 'fabric' }}"
      - name: Capture build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.loader }}-jar
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
