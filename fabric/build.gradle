plugins { id 'fabric-loom' version '1.17.21' }
def sharedProperties = new Properties()
file('../gradle.properties').withInputStream { sharedProperties.load(it) }
def mcVersion = project.findProperty('minecraft_version') ?: sharedProperties.getProperty('minecraft_version')
if (mcVersion != '1.20.1') throw new GradleException('This branch currently supports MC 1.20.1 only')
version = sharedProperties.getProperty('mod_version')
group = sharedProperties.getProperty('maven_group')
base.archivesName = sharedProperties.getProperty('archives_base_name') + '-fabric-mc' + mcVersion
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroupByRegex 'org.junit.*'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
    modCompileOnly "maven.modrinth:minecraft-transit-railway:FABRIC-4.0.5+${mcVersion}"
    modCompileOnly "maven.modrinth:xaeros-minimap:fabric-${mcVersion}-26.4.2"
    modCompileOnly "maven.modrinth:xaeros-world-map:fabric-${mcVersion}-1.45.0"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'maven.modrinth:minecraft-transit-railway:FABRIC-4.0.5+1.20.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.java.srcDir('../src/test/java')
test {
    useJUnitPlatform()
    systemProperty 'mtrmap.generateTestWorld', project.findProperty('mtrmapGenerateTestWorld') ?: 'false'
}
sourceSets.main.resources.srcDir('../src/main/resources')
sourceSets.main.resources.exclude('META-INF/mods.toml', 'mtrmap.mixins.json')
compileJava.source(fileTree('../src/main/java') {
    exclude 'com/lx862/mtrmap/MTRMap.java'
    exclude 'com/lx862/mtrmap/MTRMapClient.java'
    exclude 'com/lx862/mtrmap/config/MTRMapConfig.java'
    exclude 'com/lx862/mtrmap/network/MTRNetwork.java'
    exclude 'com/lx862/mtrmap/network/MTRNetworkClient.java'
    exclude 'com/lx862/mtrmap/CommandRegistration.java'
    exclude 'com/lx862/mtrmap/mixin/client/xaero/XaeroWorldMapMixin.java'
})
processResources {
    inputs.properties(version: project.version, minecraft_version: mcVersion)
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) { expand version: project.version, minecraft_version: mcVersion }
}
jar { manifest.attributes('MixinConfigs': 'mtrmap.fabric.mixins.json') }

ext.journeyMapLoader = 'fabric'
apply from: '../gradle/journeymap-api.gradle'
