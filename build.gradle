plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
ext.journeyMapLoader = 'forge'
apply from: 'gradle/minecraft-target.gradle'
version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name + '-forge-mc' + project.minecraft_version
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            mods { mtrmap { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            mods { mtrmap { source sourceSets.main } }
        }
    }
}
mixin {
    add sourceSets.main, 'mtrmap.refmap.json'
    config 'mtrmap.mixins.json'
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${targetForgeVersion}"
    compileOnly "maven.modrinth:minecraft-transit-railway:FORGE-${mtr_version}+${minecraft_version}"
    compileOnly fg.deobf("maven.modrinth:xaeros-minimap:forge-${minecraft_version}-26.4.2")
    compileOnly fg.deobf("maven.modrinth:xaeros-world-map:forge-${minecraft_version}-1.45.0")
    compileOnly fg.deobf("maven.modrinth:journeymap:${journeyMapModVersion}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation "maven.modrinth:minecraft-transit-railway:FORGE-${mtr_version}+${minecraft_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
test {
    useJUnitPlatform()
    systemProperty 'mtrmap.generateTestWorld', project.findProperty('mtrmapGenerateTestWorld') ?: 'false'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.properties(version: project.version, minecraft_version: project.minecraft_version, mtr_version: project.mtr_version, forge_major: targetForgeMajor, journeymap_minimum: journeyMapMinimum, pack_format: targetPackFormat)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand version: project.version, minecraft_version: project.minecraft_version, mtr_version: project.mtr_version, forge_major: targetForgeMajor, journeymap_minimum: journeyMapMinimum, pack_format: targetPackFormat
    }
}
jar {
    manifest.attributes('MixinConfigs': 'mtrmap.mixins.json')
    finalizedBy 'reobfJar'
}



apply from: 'gradle/journeymap-api.gradle'

if (legacyJourneyMap) {
    def common = fileTree('compat/mc1204/common/java')
    def forge = fileTree('compat/mc1204/forge/java')
    def overrides = (common.files.collect { common.dir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            + forge.files.collect { forge.dir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            + journeyMap5Overrides)
    compileJava.setSource(files(fileTree('src/main/java') { exclude overrides }, common, forge, journeyMap5GeneratedSources))
    compileJava.dependsOn generateJourneyMap5Adapters
    processResources.doLast {
        def config = new File(destinationDir, 'mtrmap.mixins.json')
        def json = new groovy.json.JsonSlurper().parse(config)
        json.client.add('client.journeymap.JourneyMapFullscreenMixin')
        config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}
