plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version = project.mod_version
if (project.minecraft_version != '1.20.1') throw new GradleException('This branch currently supports MC 1.20.1 only')
group = project.maven_group
base.archivesName = project.archives_base_name + '-forge-mc' + project.minecraft_version
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            mods { mtrmap { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            mods { mtrmap { source sourceSets.main } }
        }
    }
}
mixin {
    add sourceSets.main, 'mtrmap.refmap.json'
    config 'mtrmap.mixins.json'
}
repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly "maven.modrinth:minecraft-transit-railway:FORGE-${mtr_version}+${minecraft_version}"
    compileOnly fg.deobf("maven.modrinth:xaeros-minimap:forge-${minecraft_version}-26.4.2")
    compileOnly fg.deobf("maven.modrinth:xaeros-world-map:forge-${minecraft_version}-1.45.0")
    compileOnly fg.deobf('maven.modrinth:journeymap:1.20.1-6.0.6+forge')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation "maven.modrinth:minecraft-transit-railway:FORGE-${mtr_version}+${minecraft_version}"
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}
test {
    useJUnitPlatform()
    systemProperty 'mtrmap.generateTestWorld', project.findProperty('mtrmapGenerateTestWorld') ?: 'false'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.properties(version: project.version, minecraft_version: project.minecraft_version, mtr_version: project.mtr_version)
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand version: project.version, minecraft_version: project.minecraft_version, mtr_version: project.mtr_version
    }
}
jar {
    manifest.attributes('MixinConfigs': 'mtrmap.mixins.json')
    finalizedBy 'reobfJar'
}



ext.journeyMapLoader = 'forge'
apply from: 'gradle/journeymap-api.gradle'
